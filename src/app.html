<!doctype html>
<html lang="%echobell.lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("echobell-theme");
          const dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-neutral-100 dark:bg-neutral-900 flex min-h-screen flex-col">
    <div class="contents">%sveltekit.body%</div>
  </body>
</html>
